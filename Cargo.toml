[package]
name = "resume"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "resume"
path = "src/main.rs"

[dependencies]
notify = "6"
git2 = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
fs2 = "0.4"
dotenvy = "0.15"
ratatui = "0.29"
crossterm = "0.28"

# ── Optional runtime dependencies ─────────────────────────────────────────────
# Ollama is required for local model inference. resume works without it as long
# as ANTHROPIC_API_KEY is set. Install Ollama, then pull the models below.
#
#   Install:  https://ollama.ai
#   Models:   ollama pull qwen3.5
#             ollama pull qwen3-coder:30b
#             ollama pull deepseek-coder-v2:16b
#
# When packaging (Homebrew formula, install script, etc.) surface this prominently:
#   - Check `which ollama` and offer to install if missing
#   - Run `ollama pull` for the models the user selects
#   - resume doctor (planned) will verify which models are reachable
[package.metadata.optional-runtime.ollama]
version = ">=0.3"
url = "https://ollama.ai"
purpose = "local model inference (no API key required)"
models = ["qwen3.5", "qwen3-coder:30b", "deepseek-coder-v2:16b"]
